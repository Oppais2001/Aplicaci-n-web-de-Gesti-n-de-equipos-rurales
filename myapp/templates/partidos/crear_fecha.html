{% extends 'layouts/base.html' %}

{% block content %}

<div class="ingresar">
    <div>
        <h1>Crear Fecha</h1>
    </div>

    <div class="container-forms-card">
        <div class="card form-container">
            <form method="POST" class="form-registro">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Guardar</button>
            </form>
        </div>

        <div>
            <div class="card">
                <h2>Programación</h2>
                <p>
                    Crea el partido con torneo, equipos, cancha, fecha y hora.
                    El resultado se registra despues desde Crear Partido.
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
