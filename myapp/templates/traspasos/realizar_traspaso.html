{% extends 'layouts/base.html' %}

{% block content %}

<div class="ingresar">

    <div class="card-title">
        <h1>Realizar Traspaso</h1>
    </div>

    <div class="traspaso-resumen">
        <div class="traspaso-icono">
            <i class="fas fa-right-left"></i>
        </div>
        <div class="traspaso-info">
            <span class="traspaso-label">Jugador seleccionado</span>
            <span class="traspaso-jugador">{{ jugador.nombre }}</span>
            <span class="traspaso-equipo">
                Equipo actual: <strong>{{ jugador.equipo }}</strong>
            </span>
        </div>
    </div>

    <div class="card form-container">
        <form method="POST" class="form-registro">
            {% csrf_token %}
            {{ form }}
            <button>Guardar</button>
        </form>
    </div>

</div>

<style>
    .traspaso-resumen {
        display: flex;
        align-items: center;
        gap: 20px;
        background: var(--bg-card);
        border: 1px solid var(--borde);
        border-left: 4px solid var(--color-principal);
        border-radius: var(--radio-lg);
        padding: 18px 24px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
    }

    .traspaso-icono {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 215, 0, 0.1);
        color: var(--color-principal);
        font-size: 1.3rem;
        flex-shrink: 0;
    }

    .traspaso-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .traspaso-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--texto-tenue);
    }

    .traspaso-jugador {
        font-size: 1.3rem;
        font-weight: 700;
        color: whitesmoke;
    }

    .traspaso-equipo {
        font-size: 0.95rem;
        color: var(--texto-tenue-2);
    }

    .traspaso-equipo strong {
        color: var(--color-principal);
        font-weight: 600;
    }

    @media (max-width: 480px) {
        .traspaso-resumen {
            flex-direction: column;
            text-align: center;
        }
    }
</style>

{% endblock %}
